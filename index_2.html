<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patronenlab app prototype v1.4.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Avenir','Avenir Next','Nunito Sans',system-ui,sans-serif;
  --bg:#FAF9F6; --paper:#FFFFFF; --tint:#EDF6FD; --fg:#000000; --ink:#2B2822; --muted:#5F5D58; --line:#E4DED3;
  --lijf:#9EDCF8; --lijf-ink:#0E3B52; --lijf-rim:#7DB7D2;
  --jij:#FF8ACD; --jij-ink:#621843; --jij-rim:#D673AD;
  --anderen:#E2FAA9; --anderen-ink:#3B4710; --anderen-rim:#BCD385;
  --omgeving:#00AC75; --omgeving-ink:#00301F; --omgeving-rim:#007A53;
  --krachten:#2E24C1; --krachten-ink:#FFFFFF; --krachten-rim:#1D168A;
  --oranje:#FF3E00;
  --action:#2E24C1; --action-fg:#FFFFFF;
  --swipe-label:#908F88; --placeholder:#B6B4AD; --orig-alpha:.35;
  --top:46px;
  /* lettergroottes zoals in het ontwerp */
  --t32:32px; --t28:28px; --t26:26px; --t25:25px; --t18:18px; --t17:17px; --t16:16px; --t15:15px; --t14:14px; --t13:13px; --t12:12px; --t11:11px; --t10:10px; --t8:8px;
  --hit:24px;
}
/* ---- versie met HIG-aanpassingen ---- */
.hig{
  --action:#2B2822;                         /* 8: indigo alleen voor krachten */
  --swipe-label:#6B6862;                    /* 2: 5,1:1 */
  --placeholder:#76726B;                    /* 3: 4,7:1 */
  --top:72px;                               /* 6: onder de statusbalk */
  --t28:25px; --t26:25px; --t18:17px; --t16:17px; --t14:15px; --t12:13px; --t10:12px; --t8:11px;   /* 1 en 11 */
  --hit:44px;                               /* 7 */
  --jij-orig:#722050; --lijf-orig:#24546B; --anderen-orig:#5A6B23; --omgeving-orig:#00301F; --krachten-orig:#C9C5F2;   /* 4 */
}
*{box-sizing:border-box; margin:0; padding:0;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{background:#E9E5DD; font-family:var(--font); color:var(--fg); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; -webkit-font-smoothing:antialiased;}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer;}
input,textarea{font:inherit; color:inherit;}
.meta{position:fixed; top:14px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#5F5D58; z-index:5;}
.meta strong{color:#2B2822; letter-spacing:.04em; text-transform:uppercase; font-weight:800;}
.meta button{border:1px solid #D6D0C4; background:#FFF; border-radius:999px; padding:7px 14px; font-weight:700; color:#2B2822;}
.stage{transform-origin:center center;}
.phone{width:393px; height:852px; border-radius:54px; background:var(--bg); position:relative; overflow:hidden; box-shadow:0 0 0 10px #1F1D1A, 0 0 0 11px #3A3631, 0 30px 80px rgba(0,0,0,.25);}
.statusbar{position:absolute; top:0; left:0; right:0; height:54px; display:flex; justify-content:space-between; align-items:center; padding:6px 34px 0 46px; font-weight:700; font-size:16px; z-index:40; pointer-events:none;}
.island{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:124px; height:36px; border-radius:20px; background:#000; z-index:41;}
.statusbar .icons{display:flex; gap:6px; align-items:center;}
.homebar{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:136px; height:5px; border-radius:3px; background:#000; z-index:60; pointer-events:none;}
.screen{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; transition:opacity .22s ease, transform .22s ease;}
.screen::-webkit-scrollbar{display:none;}
.screen.enter{opacity:0; transform:translateX(24px);}
.screen.enter.back{transform:translateX(-24px);}
.pad{padding:var(--top) 37px 120px;}
h1{font-size:var(--t32); line-height:1.08; font-weight:800; letter-spacing:-.01em;}
.lead{font-size:var(--t16); line-height:1.5; margin-top:12px;}
.caps{font-size:var(--t16); letter-spacing:.04em; text-transform:uppercase; font-weight:700;}
.back{position:relative; width:var(--hit); height:var(--hit); display:flex; align-items:center; justify-content:flex-start; margin:4px 0 10px -2px;}
.hig .back{margin-left:-12px; justify-content:center;}
.hig .check .pad, .hig .xd{padding-top:56px;}
.back svg{width:18px; height:18px;}
/* knoppen */
.btn{height:47px; border-radius:999px; padding:0 26px; font-size:var(--t17); font-weight:800; display:inline-flex; align-items:center; justify-content:center; gap:12px;}
.btn.primary{background:var(--action); color:var(--action-fg);}
.btn.ghost{background:#FFF; border:1.5px solid var(--line); color:var(--ink);}
.btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.card-start svg{stroke-width:1.6;}
.hig .card-start svg{stroke-width:2.2;}
/* tabbalk */
.tabbar{position:absolute; left:20px; right:20px; bottom:30px; height:64px; background:#FFF; border:1.5px solid var(--line); border-radius:999px; display:flex; align-items:center; padding:5px; z-index:30; gap:2px;}
.tab{flex:1; height:100%; border-radius:999px; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--ink);}
.tab svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.tab .tl{display:none; font-size:var(--t15); font-weight:800;}
.tab.on{flex:2.4; background:var(--action); color:#FFF;}
.tab{transition:flex .25s ease, background-color .2s ease;}
.tab.on .tl{display:inline;}
/* bouwstenen */
svg.bs{overflow:visible; display:block;}
.bs-word{font-weight:900; text-transform:uppercase; letter-spacing:.01em;}
/* sheets */
.scrim{position:absolute; inset:0; background:rgba(20,18,15,.35); z-index:70; opacity:0; transition:opacity .2s;}
.scrim.show{opacity:1;}
.sheet{position:absolute; left:0; right:0; bottom:0; background:#FFF; border-radius:28px 28px 0 0; z-index:71; padding:12px 28px 46px; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); max-height:86%; overflow-y:auto;}
.sheet.show{transform:none;}
.grab{width:40px; height:5px; border-radius:3px; background:#DDD7CC; margin:0 auto 18px;}
.sheet h2{font-size:var(--t25); font-weight:800; margin-bottom:10px;}
.sheet p{font-size:var(--t16); line-height:1.5; margin-bottom:12px;}
.sheet .row{display:flex; gap:10px; margin-top:16px;}
.sheet .x{position:absolute; top:14px; right:16px; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.sheet .x svg{width:16px; height:16px; stroke:#2B2822; stroke-width:2.2; stroke-linecap:round;}
.steps{list-style:none; counter-reset:s; margin:8px 0 6px;}
.steps li{counter-increment:s; position:relative; padding-left:40px; margin-bottom:14px; font-size:var(--t16); line-height:1.45;}
.steps li::before{content:counter(s); position:absolute; left:0; top:-2px; width:28px; height:28px; border-radius:50%; background:var(--tint); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.label{font-size:var(--t13); font-weight:800; letter-spacing:.03em; text-transform:uppercase; margin:22px 0 10px; color:var(--ink);}
.field{width:100%; height:56px; border-radius:16px; border:2px solid var(--line); background:#FFF; padding:0 18px; font-size:var(--t18); outline:none;}
.field:focus{border-color:var(--action);}
textarea.field{height:120px; padding:14px 18px; resize:none; line-height:1.4;}
.chips{display:flex; flex-wrap:wrap; gap:10px;}
.chip{height:40px; padding:0 20px; border-radius:999px; background:#FFF; font-size:var(--t15); border:1.5px solid transparent;}
.sheet .chip{border-color:var(--line);}
.chip.on{background:var(--jij); border-color:var(--jij);}
.toast{position:absolute; left:50%; top:58px; transform:translate(-50%,-12px); background:#2B2822; color:#FFF; padding:12px 18px; border-radius:999px; font-size:14px; font-weight:700; opacity:0; transition:.25s; z-index:80; white-space:nowrap; pointer-events:none;}
.toast.show{opacity:1; transform:translate(-50%,0);}
/* scherm-specifiek */
.welcome-ill{margin:24px -37px 0; height:236px; background:var(--tint); position:relative; overflow:hidden; margin-left:0; margin-right:0;}
.foot{font-size:var(--t10); font-weight:700; text-align:center; margin-top:14px;}
.home-head{display:flex; justify-content:space-between; align-items:flex-start;}
.avatar{width:var(--hit); height:var(--hit); position:relative; width:62px; height:62px; margin-top:-4px;}
.avatar .who{display:none;}
.hig .avatar .who{display:block; position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:11px; font-weight:800;}
.date{font-size:var(--t16); margin-top:6px;}
.hero{margin-top:36px; background:var(--tint); border-radius:14px; height:162px; position:relative; padding:20px;}
.hero h2{font-size:var(--t25); line-height:1.02; font-weight:800; position:relative; z-index:2;}
.hero .btn{position:absolute; left:20px; bottom:20px; height:40px; padding:0 20px; font-size:var(--t15); gap:8px; z-index:2;}
.hero .btn svg{width:15px; height:15px;}
.hero .ill{position:absolute; right:-6px; top:36px;}
.timeline{margin-top:10px;}
.tl-item{display:flex; align-items:center; gap:16px; margin-bottom:16px; width:100%; text-align:left;}
.tl-date{width:57px; text-align:center; font-size:var(--t16); line-height:1.05; font-weight:800; color:#5E5C57;}
.tl-date .n{font-size:var(--t16);}
.tl-date .nu{display:none; font-size:11px; font-weight:800; color:var(--ink); margin-top:4px;}
.hig .tl-date .nu{display:block;}
.tl-card{flex:1; min-height:56px; border-radius:12px; background:#FFF; padding:11px 14px; position:relative;}
.tl-card .t{font-size:var(--t11); font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:inherit;}
.tl-card .s{font-size:var(--t12); margin-top:3px;}
.tl-item.done .tl-card{color:#5F5D58;}
.tl-item.now .tl-card{background:var(--tint); color:var(--ink);}
.tl-item.next .tl-card{background:#F7FCE8; color:var(--ink);}
.tl-item.empty .tl-card{background:#FCFCFA; color:var(--placeholder); font-style:italic;}
.hig .tl-item.empty .tl-card{border:1.5px dashed #CFC9BE;}
.tl-card .chk{position:absolute; right:13px; top:50%; transform:translateY(-50%); width:17px; height:17px;}
/* check */
.check{background:var(--tint);}
.deck{position:relative; height:390px; margin:0 -37px; touch-action:pan-y;}
.deck .behind{position:absolute; pointer-events:none;}
.deck .card{position:absolute; left:50%; top:50%; width:260px; height:260px; margin:-130px 0 0 -130px; cursor:grab; touch-action:none; user-select:none;}
.deck .card.fly{transition:transform .35s ease, opacity .35s ease;}
.deck .card.snap{transition:transform .25s ease;}
.deck .stamp{position:absolute; top:24px; padding:6px 12px; border-radius:10px; border:3px solid; font-weight:900; font-size:18px; letter-spacing:.05em; opacity:0; text-transform:uppercase; background:rgba(255,255,255,.85);}
.deck .stamp.yes{left:18px; color:#1F7A4D; transform:rotate(-10deg);}
.deck .stamp.no{right:18px; color:#B3261E; transform:rotate(10deg);}
.arrow{position:absolute; top:50%; transform:translateY(-50%); width:var(--hit); height:var(--hit); display:flex; align-items:center; justify-content:center; color:#767A7E; z-index:3;}
.arrow svg{width:16px; height:16px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.arrow.l{left:6px;} .arrow.r{right:6px;}
.actions{display:flex; justify-content:center; gap:22px; margin-top:-6px;}
.act{display:flex; flex-direction:column; align-items:center; gap:10px; width:96px;}
.act .c{width:68px; height:68px; border-radius:50%; background:#FFF; display:flex; align-items:center; justify-content:center;}
.act .c.small{width:56px; height:56px; margin:6px 0;}
.act .c svg{width:22px; height:22px; stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.act.yes .c{background:var(--jij);}
.act.yes .c svg{stroke:var(--jij-ink);}
.act span{font-size:var(--t15); font-weight:800; color:var(--swipe-label);}
.add-link{display:flex; flex-direction:column; align-items:center; margin:26px auto 0; font-size:var(--t11); font-weight:800; gap:6px; min-height:44px;}
.add-link svg{width:16px; height:16px; stroke:#2B2822; stroke-width:2.2; stroke-linecap:round;}
.progress{position:absolute; left:0; right:0; top:342px; font-size:13px; font-weight:700; color:#5F5D58; text-align:center; display:none; pointer-events:none;}
.hig .progress{display:block;}
.done-panel{text-align:center; padding:40px 10px;}
.done-panel h2{font-size:var(--t28); font-weight:800; margin:20px 0 10px;}
.done-panel p{font-size:var(--t16); line-height:1.5; margin-bottom:26px;}
/* eigen woord */
.preview{display:flex; justify-content:center; margin:26px 0 8px;}
.icons{display:flex; justify-content:space-between;}
.ico{width:46px; height:46px; border-radius:50%; background:#FFF; display:flex; align-items:center; justify-content:center; position:relative;}
.ico svg{width:22px; height:22px; stroke:var(--ink); stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.ico.on{background:var(--jij); box-shadow:3px 3px 0 var(--jij-rim);}
.ico.on svg{stroke:var(--jij-ink);}
.save-row{text-align:center; margin-top:34px;}
.save-row .btn{min-width:150px;}
.save-row .foot{font-size:var(--t11);}
/* experimenten */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:44px;}
.exp{height:226px; border-radius:18px; padding:18px 16px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; position:relative;}
.exp h3{font-size:var(--t16); font-weight:800; line-height:1.2;}
.exp .ring{align-self:center;}
.exp .st{font-size:var(--t12); font-weight:700; display:flex; align-items:center; gap:10px;}
.exp .bar{flex:1; height:5px; border-radius:3px; background:rgba(98,24,67,.25); overflow:hidden;}
.exp .bar i{display:block; height:100%; background:var(--jij-ink);}
.exp.new{border:2px dashed #ABA59A; align-items:center; justify-content:center; gap:14px; text-align:center;}
.exp.new .plus{width:52px; height:52px; border-radius:50%; background:#FFF; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;}
.exp.new .plus svg{width:20px; height:20px; stroke:#2B2822; stroke-width:2; stroke-linecap:round;}
.exp.new h3{font-size:var(--t15);}
/* experiment detail */
.xd h1{font-size:var(--t32);}
.xd .lead{margin-top:10px;}
.xd .center{display:flex; justify-content:center; margin:30px 0 26px; position:relative;}
.xd .center .txt{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-style:italic;}
.xd .center .big{font-size:var(--t28); font-weight:800;}
.xd .center .small{font-size:var(--t15);}
.xd .q{font-size:var(--t13); font-weight:800; margin-bottom:10px;}
.rate{display:flex; gap:8px;}
.rate button{flex:1; height:48px; border-radius:999px; background:#FFF; font-size:var(--t15);}
.days{display:flex; justify-content:space-between; margin-top:24px;}
.day{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:var(--t12); font-style:italic;}
.day .d{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.day .d svg{width:14px; height:14px; stroke:#FFF; stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.belongs{margin-top:26px; width:100%; height:56px; border-radius:999px; background:#FFF; display:flex; align-items:center; padding:0 22px 0 22px; gap:14px; font-size:var(--t14);}
.belongs .k{color:#726D61; flex:0 0 auto;}
.belongs .w{font-weight:900; flex:1; text-align:left; display:flex; align-items:center; gap:10px; text-transform:uppercase;}
.belongs svg.go{width:18px; height:18px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round;}
.counter{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:8px;}
/* patroon */
.board{margin:14px -37px 0; height:510px; position:relative;}
.board svg{width:100%; height:100%;}
.board .hitbs{cursor:pointer;}
.pop{position:absolute; background:#2B2822; color:#FFF; border-radius:12px; padding:10px 14px; font-size:14px; line-height:1.3; transform:translate(-50%,-100%); white-space:nowrap; z-index:5; pointer-events:none;}
.pop small{display:block; color:#CFC9BE; font-size:12px;}
.notice{margin:6px -20px 0; background:#F7FCE8; border-radius:22px; padding:18px 20px; display:flex; gap:12px; align-items:center;}
.notice .tx{flex:1;}
.notice h3{font-size:var(--t16); font-style:italic; font-weight:800;}
.notice p{font-size:var(--t13); color:#726D61; line-height:1.4; margin-top:6px;}
.notice .plus{width:48px; height:48px; border-radius:50%; background:#FFF; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.notice .plus svg{width:18px; height:18px; stroke:#2B2822; stroke-width:2.2; stroke-linecap:round;}
.notes{margin-top:10px; list-style:none;}
.notes li{font-size:var(--t13); color:var(--ink); padding:8px 0; border-top:1px solid #E4EDCB;}
/* bouwstenen-overzicht */
.bsgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; margin-top:28px;}
.bsgrid button{display:flex; justify-content:center;}
.subhead{font-size:var(--t13); font-weight:800; letter-spacing:.03em; text-transform:uppercase; margin:30px 0 4px; color:var(--ink);}
.faded{opacity:.45;}
.pulse{animation:pulse 1.2s ease 2;}
@keyframes pulse{50%{transform:scale(1.08);}}
@media (prefers-reduced-motion:reduce){ .screen,.sheet,.deck .card{transition:none !important;} .pulse{animation:none;} }
</style>
</head>
<body class="hig">
<div class="meta"><span><strong>Patronenlab app</strong> &nbsp;prototype v1.4.3</span><button id="reset" type="button">Opnieuw beginnen</button></div>
<div class="stage" id="stage">
  <div class="phone" id="phone">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0M4 6.9a6 6 0 0 1 8 0"/><circle cx="8" cy="9.8" r="1.3" fill="#000" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" opacity=".4"/></svg>
    </span></div>
    <div id="screens"></div>
    <nav class="tabbar" id="tabbar" hidden></nav>
    <div class="scrim" id="scrim" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="homebar"></div>
  </div>
</div>
<script>
(function(){
var HIG = document.body.classList.contains('hig');

/* ---------------- vormen ---------------- */
var SHAPES = {
  cirkel: function(){ return 1; },
  zon: function(a){ return 1 + 0.07 * Math.cos(12 * a); },
  ster: function(a){ return 0.9 + 0.16 * Math.pow(Math.abs(Math.cos(3 * a)), 1.6); },
  golf8: function(a){ return 1 + 0.09 * Math.cos(8 * a); },
  bloem4: function(a){ return 1 + 0.12 * Math.cos(4 * a); },
  klaver: function(a){ return 1 + 0.13 * Math.cos(4 * a + 0.4) + 0.04 * Math.cos(8 * a); },
  bloem5: function(a){ return 0.82 + 0.26 * Math.pow(Math.abs(Math.cos(2.5 * a)), 0.8); },
  spikes10: function(a){ return 1 + 0.08 * Math.cos(10 * a); }
};
function shapeD(name, cx, cy, r, rot){
  var f = SHAPES[name] || SHAPES.cirkel, N = 160, d = '';
  rot = rot || 0;
  for (var i = 0; i < N; i++){
    var a = i / N * Math.PI * 2, rr = r * f(a);
    var x = cx + Math.cos(a + rot) * rr, y = cy + Math.sin(a + rot) * rr;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return d + 'Z';
}

/* ---------------- iconen ---------------- */

/* ---------------- bouwsteen tekenen ---------------- */
function wrapWords(t, max){
  // een lang woord mag breken op een zacht afbreekstreepje (schuld-gevoel)
  var ws = [];
  t.toUpperCase().split(' ').forEach(function(w){
    var parts = w.split('\u00AD');
    if (parts.length > 1 && w.length > max) parts.forEach(function(p, i){ ws.push(i < parts.length - 1 ? p + '-' : p); });
    else ws.push(parts.join(''));
  });
  var lines = [], cur = '';
  ws.forEach(function(w){ if ((cur + ' ' + w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur);
  return lines;
}
/* opts: r, shape, iconSize, wordSize, showOrig, origSize, dashed, maxChars */
function stoneSVG(s, o){
  o = o || {};
  var r = o.r || 60, pad = 6, size = r * 2 + pad * 2, c = r + pad;
  var fill = 'var(--' + s.cat + ')', rim = 'var(--' + s.cat + '-rim)', ink = 'var(--' + s.cat + '-ink)';
  var shape = o.shape || 'cirkel';
  var h = '<svg class="bs" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
  if (!o.noShape){
    h += '<path d="' + shapeD(shape, c + r * 0.03, c + r * 0.035, r) + '" fill="' + rim + '"/>';
    h += '<path d="' + shapeD(shape, c, c, r) + '" fill="' + fill + '"/>';
  }
  if (o.dashed) h += '<circle cx="' + c + '" cy="' + c + '" r="' + (r * 0.8) + '" fill="none" stroke="' + ink + '" stroke-width="1.4" stroke-dasharray="5 4" opacity=".75"/>';
  var lines = wrapWords(word(s), o.maxChars || 11), ws = o.wordSize || 14;
  // lange woorden passen altijd binnen de rand: de tekst wordt kleiner tot de langste regel past
  var longest = Math.max.apply(null, lines.map(function(l){ return l.length; }));
  var rText = o.dashed ? r * 0.82 : r;
  ws = Math.min(ws, (2 * rText * 0.72) / (longest * 0.72), (2 * rText * 0.56) / (lines.length * 1.08));   /* ruim binnen de rand */
  var lh = ws * 1.08;
  var hasOrig = o.showOrig && s.own && s.own.toLowerCase() !== s.label.toLowerCase();
  var os = o.origSize || 10, origLines = [];
  if (hasOrig){
    // de oorspronkelijke naam: hooguit twee regels, ruim binnen de rand
    origLines = wrapWords(s.label.replace(/\u00AD/g, ''), 14).slice(0, 2);
    var olong = Math.max.apply(null, origLines.map(function(l){ return l.length; }));
    os = Math.min(os, (2 * r * 0.66) / (olong * 0.66));
    if (os < 7.5){ hasOrig = false; origLines = []; }
  }
  var iconH = o.iconSize ? o.iconSize + 8 : 0;
  var total = iconH + lines.length * lh + (hasOrig ? origLines.length * os * 1.15 + 4 : 0);
  var y = c - total / 2;
  if (o.iconSize){
    h += '<g transform="translate(' + (c - o.iconSize / 2) + ',' + y + ')">' + icon(s.icon, o.iconSize, ink).replace('<svg', '<svg x="0" y="0"') + '</g>';
    y += iconH;
  }
  lines.forEach(function(l, i){
    h += '<text class="bs-word" x="' + c + '" y="' + (y + lh * (i + 0.8)) + '" text-anchor="middle" font-size="' + ws + '" fill="' + ink + '">' + esc(l) + '</text>';
  });
  y += lines.length * lh;
  if (hasOrig){
    var origFill = HIG ? 'var(--' + s.cat + '-orig)' : ink;
    var op = HIG ? 1 : 0.35;
    var weight = HIG ? 500 : 900;
    origLines.forEach(function(l, i){
      h += '<text x="' + c + '" y="' + (y + 4 + os * (0.9 + i * 1.15)) + '" text-anchor="middle" font-size="' + os + '" font-weight="' + weight + '" fill="' + origFill + '" opacity="' + op + '" style="letter-spacing:.03em">' + esc(l) + '</text>';
    });
  }
  return h + '</svg>';
}
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

/* ---------------- navigatie ---------------- */
var screensEl = document.getElementById('screens'), tabbar = document.getElementById('tabbar');
var TABS = [ { id: 'home', l: 'Gesprekken', i: UI.cal }, { id: 'stenen', l: 'Bouwstenen', i: UI.stones }, { id: 'patroon', l: 'Patroon', i: UI.net }, { id: 'experimenten', l: 'Experimenten', i: UI.dashed } ];
var TAB_SCREENS = { home: 1, stenen: 1, patroon: 1, experimenten: 1 };
function go(name, params, opts){
  opts = opts || {};
  if (!opts.replace && !opts.back) S.history.push({ screen: S.screen, params: S.params });
  S.screen = name; S.params = params || {};
  render(opts.back);
}
function back(){
  var prev = S.history.pop();
  if (!prev) return go('home', {}, { replace: true });
  S.screen = prev.screen; S.params = prev.params || {};
  render(true);
}
function tabTo(id){ S.history = []; go(id, {}, { replace: true }); }
function renderTabs(){
  tabbar.hidden = !TAB_SCREENS[S.screen];
  if (tabbar.hidden) return;
  tabbar.innerHTML = TABS.map(function(t){
    var on = t.id === S.screen;
    return '<button class="tab' + (on ? ' on' : '') + '" data-tab="' + t.id + '" aria-label="' + t.l + '"' + (on ? ' aria-current="page"' : '') + '>' + t.i + '<span class="tl">' + t.l + '</span></button>';
  }).join('');
}
tabbar.addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if (b) tabTo(b.dataset.tab); });

function render(isBack){
  closeSheet(true);
  var el = document.createElement('div');
  el.className = 'screen enter' + (isBack ? ' back' : '');
  var fn = SCREENS[S.screen];
  el.innerHTML = fn.html();
  if (fn.cls) el.classList.add(fn.cls);
  var old = screensEl.firstChild;
  screensEl.appendChild(el);
  if (old) old.remove();
  requestAnimationFrame(function(){ el.classList.remove('enter', 'back'); });
  if (fn.wire) fn.wire(el);
  renderTabs();
}
function backBtn(){ return '<button class="back" data-act="back" aria-label="Terug">' + UI.chevL + '</button>'; }

/* ---------------- sheets en meldingen ---------------- */
var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html, wire){
  sheet.innerHTML = '<div class="grab"></div><button class="x" data-close aria-label="Sluiten">' + UI.x + '</button>' + html;
  sheet.hidden = false; scrim.hidden = false;
  requestAnimationFrame(function(){ sheet.classList.add('show'); scrim.classList.add('show'); });
  sheet.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', function(){ closeSheet(); }); });
  if (wire) wire(sheet);
}
function closeSheet(instant){
  sheet.classList.remove('show'); scrim.classList.remove('show');
  if (instant){ sheet.hidden = true; scrim.hidden = true; return; }
  setTimeout(function(){ if (!sheet.classList.contains('show')){ sheet.hidden = true; scrim.hidden = true; } }, 280);
}
scrim.addEventListener('click', function(){ closeSheet(); });
var toastT;
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('show'); }, 2200); }

    function mark(){
      sh.querySelectorAll('[data-s]').forEach(function(c){ var s = stone(c.dataset.s), on = c.dataset.s === pick; c.style.background = on ? 'var(--' + s.cat + ')' : '#FFF'; c.style.borderColor = on ? 'var(--' + s.cat + ')' : 'var(--line)'; c.style.color = on ? 'var(--' + s.cat + '-ink)' : ''; });
      sh.querySelectorAll('[data-d]').forEach(function(c){ var on = c.dataset.d === dur; c.style.background = on ? '#2B2822' : '#FFF'; c.style.color = on ? '#FFF' : ''; c.style.borderColor = on ? '#2B2822' : 'var(--line)'; });
    }
    sh.querySelectorAll('[data-s]').forEach(function(c){ c.addEventListener('click', function(){ pick = c.dataset.s; mark(); }); });
    sh.querySelectorAll('[data-d]').forEach(function(c){ c.addEventListener('click', function(){ dur = c.dataset.d; mark(); }); });
    mark();
    sh.querySelector('#xok').addEventListener('click', function(){
      var t = sh.querySelector('#xt').value.trim(); if (!t){ sh.querySelector('#xt').focus(); return; }
      var s = stone(pick), shapes = ['zon', 'bloem4', 'golf8', 'spikes10'];
      S.experiments.push({ id: 'x' + Date.now(), title: t.charAt(0).toUpperCase() + t.slice(1), text: '', cat: s.cat, shape: shapes[S.experiments.length % 4], kind: dur === 'Zo vaak als ik wil' ? 'count' : 'days', day: 1, of: dur === '14 dagen' ? 14 : 7, count: 0, stone: pick });
      closeSheet(); render(); toast('Je experiment is gestart');
    });
  });
}

SCREENS.exp = {
  html: function(){
    var x = S.experiments.filter(function(e){ return e.id === S.params.id; })[0], s = stone(x.stone);
    var ink = 'var(--' + x.cat + '-ink)', mid = '', body = '';
    var btnInk = x.cat === 'krachten' ? 'var(--krachten)' : ink;   /* witte tekst op een witte knop is onleesbaar */
    if (x.kind === 'days'){
      mid = '<span class="big">dag ' + x.day + '</span><span class="small">van ' + x.of + '</span>';
      var names = ['ma', 'di', 'wo', 'do', 'vr', 'za', 'zo'];
      body = '<p class="q">Hoe ging het gisteravond?</p><div class="rate">' + ['Ging goed', 'Een beetje', 'Lukte niet'].map(function(r){ var on = x.rating === r; return '<button data-rate="' + r + '" aria-pressed="' + on + '" style="' + (on ? 'background:' + ink + ';color:var(--' + x.cat + ')' : 'color:' + ink) + '">' + r + '</button>'; }).join('') + '</div>' +
        '<div class="days">' + names.map(function(n, i){
          var dayN = i + 1, done = dayN < x.day, today = dayN === x.day;
          var c = done ? '<span class="d" style="background:' + ink + '">' + UI.check + '</span>' : today ? '<span class="d" style="border:2px solid ' + ink + '"></span>' : '<span class="d" style="border:2px dotted ' + ink + '"></span>';
          return '<div class="day" style="color:' + ink + (today ? ';font-weight:800' : '') + '">' + c + n + '</div>';
        }).join('') + '</div>';
    } else if (x.kind === 'count'){
      mid = '<span class="big">' + x.count + ' keer</span><span class="small">gedaan</span>';
      body = '<p class="q">Heb je het vandaag gedaan?</p><div class="counter"><button class="btn" style="background:#FFF;color:' + btnInk + ';flex:1" data-act="plus">Ja, ik heb het gedaan ' + UI.check + '</button></div>';
    } else {
      mid = '<span class="big">over 4</span><span class="small">dagen</span>';
      body = '<p class="q">Dit experiment begint ' + x.start + '.</p><div class="counter"><button class="btn" style="background:#FFF;color:' + btnInk + ';flex:1" data-act="now">Ik wil vandaag al beginnen</button></div>';
    }
    var lead = x.text || 'Een klein experiment om te zien wat helpt.';
    return '<div class="pad xd" style="background:var(--' + x.cat + '); min-height:100%; padding-bottom:50px; color:' + ink + '">' +
      '<button class="back" data-act="back" aria-label="Terug" style="color:' + ink + '">' + UI.chevL + '</button><h1>' + esc(x.title) + '</h1><p class="lead" style="color:' + (x.cat === 'krachten' ? '#FFF' : '#000') + '">' + esc(lead) + '</p>' +
      '<div class="center"><svg width="190" height="190" viewBox="0 0 190 190"><path d="' + shapeD(x.shape, 95, 95, 80) + '" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="2.6 3" stroke-linecap="round"/></svg><div class="txt">' + mid + '</div></div>' + body +
      '<button class="belongs" data-act="stone" style="color:' + (x.cat === 'krachten' ? 'var(--krachten)' : ink) + '"><span class="k">Hoort bij</span><span class="w"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="16" cy="16" r="13" fill="var(--' + s.cat + '-rim)"/><circle cx="15" cy="15" r="13" fill="var(--' + s.cat + ')"/></svg>' + esc(word(s)) + '</span><svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>';
  },
  wire: function(el){
    var x = S.experiments.filter(function(e){ return e.id === S.params.id; })[0];
    on(el, 'back', back);
    el.querySelectorAll('[data-rate]').forEach(function(b){ b.addEventListener('click', function(){ x.rating = b.dataset.rate; go('exp', S.params, { replace: true }); }); });
    on(el, 'plus', function(){ x.count++; go('exp', S.params, { replace: true }); toast('Goed bezig'); });
    on(el, 'now', function(){ x.kind = 'days'; x.day = 1; x.of = 7; go('exp', S.params, { replace: true }); });
    on(el, 'stone', function(){ S.history = []; go('patroon', { highlight: x.stone }, { replace: true }); });
  }
};
/* go() met replace laat de geschiedenis staan */
var _go = go;
go = function(name, params, opts){
  if (opts && opts.replace){ S.screen = name; S.params = params || {}; render(opts.back); return; }
  _go(name, params, opts);
};
tabTo = function(id){ S.history = []; go(id, {}, { replace: true }); };

function on(el, act, fn){ el.querySelectorAll('[data-act="' + act + '"]').forEach(function(b){ b.addEventListener('click', fn); }); }

/* ---------------- schaal ---------------- */
var stage = document.getElementById('stage');
function currentScale(){ return parseFloat(stage.dataset.s || '1'); }
function fit(){
  var s = Math.min(1, (window.innerHeight - 80) / 872, (window.innerWidth - 40) / 413);
  stage.style.transform = 'scale(' + s + ')'; stage.dataset.s = s;
}
window.addEventListener('resize', fit); fit();
document.getElementById('reset').addEventListener('click', function(){ S = freshState(); render(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
render();
})();
</script>
